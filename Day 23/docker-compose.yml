services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: day23_fastapi

    environment:
      MODEL_PATH: /app/model/high_value_transaction_model.pkl
      LOG_PATH: /app/logs/predictions.log

    ports:
      - "8000:8000"

    networks:
      - day23_network

    volumes:
      - model_volume:/app/model:ro
      - logs_volume:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

    cpus: "0.50"
    mem_limit: 512m

  backend:
    image: redis:7-alpine

    container_name: day23_backend

    networks:
      - day23_network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - backend_data:/data

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

    cpus: "0.25"
    mem_limit: 256m

networks:
  day23_network:
    driver: bridge

volumes:
  model_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./model

  logs_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs

  backend_data: