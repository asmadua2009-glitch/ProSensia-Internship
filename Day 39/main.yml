name: ML Service CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8

      - name: Check formatting with Black
        run: |
          black --check .

      - name: Check code quality with Flake8
        run: |
          flake8 . --exclude=.venv,venv,__pycache__,.git

      - name: Run pytest
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
          ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
        run: |
          pytest -v test_pipeline.py

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t prosensia-ml-service:latest \
            -t ghcr.io/${{ github.repository_owner }}/prosensia-ml-service:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/prosensia-ml-service:latest